name: NOVA MARKET CI
on:
  push:
    branches: [nova-market-rebuild]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Build distributable source ZIP
        run: |
          mkdir -p /tmp/nova-package
          git archive HEAD | tar -x -C /tmp/nova-package
          rm -f /tmp/nova-package/NOVAMARKET.zip
          cd /tmp/nova-package
          zip -qr "$GITHUB_WORKSPACE/nova_marketplace_mvp.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: nova-marketplace-mvp
          path: nova_marketplace_mvp.zip
          if-no-files-found: error
          retention-days: 30
