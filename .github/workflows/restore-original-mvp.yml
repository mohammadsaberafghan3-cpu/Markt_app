name: Restore original NOVA MVP source
on:
  push:
    branches: [nova-market-rebuild]
permissions:
  contents: write
jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'Restore original MVP source') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore original marketplace files from repository archive
        run: |
          mkdir -p /tmp/nova-original
          unzip -q NOVAMARKET.zip -d /tmp/nova-original
          test -f /tmp/nova-original/nova_marketplace/server.js
          mkdir -p legacy-rebuild
          if [ -f db.js ]; then mv db.js legacy-rebuild/db.js; fi
          if [ -f test/smoke.test.js ]; then mv test/smoke.test.js legacy-rebuild/smoke.test.js; fi
          cp -R /tmp/nova-original/nova_marketplace/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original MVP source from NOVAMARKET.zip"
          git push
