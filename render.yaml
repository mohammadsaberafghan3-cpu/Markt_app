services:
  - type: web
    name: nova-market-v2-preview
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/nova-data/nova.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@novamarket.local
      - key: ADMIN_PASSWORD
        sync: false
